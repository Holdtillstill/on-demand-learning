apiVersion: v1
kind: Namespace
metadata:
  name: payments
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: checkout
  namespace: payments
spec:
  rules:
    - host: checkout.example.com
      http:
        paths:
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: checkout
                port:
                  name: http
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: payments
spec:
  selector:
    app: checkout
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Pod
metadata:
  name: checkout-example
  namespace: payments
  labels:
    app: checkout
spec:
  containers:
    - name: checkout
      image: nginx:1.25-alpine
      ports:
        - name: http
          containerPort: 8080

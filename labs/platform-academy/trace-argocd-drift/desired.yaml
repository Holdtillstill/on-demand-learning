apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: payments
  labels:
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: checkout
          image: registry.example.com/checkout@sha256:2222
          resources:
            requests:
              cpu: 250m
              memory: 256Mi

name: platform-static-smoke

on:
  workflow_dispatch:
    inputs:
      web_base:
        description: Static Platform Academy web origin
        required: false
        type: string
  schedule:
    - cron: "47 14 * * *"

permissions:
  contents: read

jobs:
  smoke-static:
    runs-on: ubuntu-latest
    env:
      WEB_BASE: ${{ inputs.web_base || vars.PLATFORM_STATIC_WEB_BASE || 'https://platform-academy.bozhi.dev' }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/platform-academy/package-lock.json

      - name: Install Platform Academy browser dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: apps/platform-academy

      - name: Smoke Platform Academy static host
        run: npm run smoke:static-host
        working-directory: apps/platform-academy

      - name: Smoke Platform Academy static browser rendering
        run: npm run smoke:browser-static-host
        working-directory: apps/platform-academy

      - name: Validate Platform Academy UI flows
        run: npm run validate:figma-ui
        working-directory: apps/platform-academy

      - name: Write smoke summary
        if: always()
        run: |
          {
            echo "## Platform Academy Static Smoke"
            echo
            echo "- Web base: ${WEB_BASE}"
            echo "- Checks: app shell routes, static API snapshots, lab packet, security headers, clean SPA routing, browser rendering, UI flows"
            echo "- Workflow: ${GITHUB_WORKFLOW}"
            echo "- Commit: ${GITHUB_SHA}"
          } >> "${GITHUB_STEP_SUMMARY}"

name: platform-static-smoke

on:
  workflow_dispatch:
    inputs:
      web_base:
        description: Static Platform Academy web origin
        required: false
        type: string
  schedule:
    - cron: "47 14 * * *"

permissions:
  contents: read

jobs:
  smoke-static:
    runs-on: ubuntu-latest
    env:
      WEB_BASE: ${{ inputs.web_base || vars.PLATFORM_STATIC_WEB_BASE || 'https://platform-academy.bozhi.dev' }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Smoke Platform Academy static host
        run: npm run smoke:static-host
        working-directory: apps/platform-academy

      - name: Write smoke summary
        if: always()
        run: |
          {
            echo "## Platform Academy Static Smoke"
            echo
            echo "- Web base: ${WEB_BASE}"
            echo "- Checks: app shell routes, visitor tag, static API snapshots, lab packet, security headers"
            echo "- Workflow: ${GITHUB_WORKFLOW}"
            echo "- Commit: ${GITHUB_SHA}"
          } >> "${GITHUB_STEP_SUMMARY}"

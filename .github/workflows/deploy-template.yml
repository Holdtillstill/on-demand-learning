name: deploy-template

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy
        required: true
        default: latest

jobs:
  render:
    runs-on: ubuntu-latest
    environment: production-approval-required
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Explain manual deployment guardrail
        run: |
          echo "This workflow is a template only."
          echo "Configure AWS OIDC, ECR image promotion, kubeconfig, and environment approval before applying manifests."
      - name: Validate Kubernetes manifests
        run: docker run --rm -v "${PWD}:/work" ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary /work/infra/k8s/zhongwen-platform.yaml
      - name: Render intended image tag
        run: printf 'Would deploy image tag %s after explicit approval.\n' "${IMAGE_TAG}"
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}

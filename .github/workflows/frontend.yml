name: frontend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - name: zhongwen
            path: apps/frontend
          - name: platform-academy
            path: apps/platform-academy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.app.path }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.app.path }}
      - run: npm run typecheck
        working-directory: ${{ matrix.app.path }}
      - run: npm test
        working-directory: ${{ matrix.app.path }}
      - run: npm run build
        working-directory: ${{ matrix.app.path }}

  platform-academy-browser-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/platform-academy/package-lock.json

      - name: Install API dependencies
        run: pip install -r apps/api/requirements.txt

      - name: Install Platform Academy dependencies
        run: npm ci
        working-directory: apps/platform-academy

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/platform-academy

      - name: Run Platform Academy browser smoke
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/smoke-artifacts"
          api_log="${GITHUB_WORKSPACE}/smoke-artifacts/platform-academy-api.log"

          python -u -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > "${api_log}" 2>&1 &
          api_pid=$!
          VITE_API_BASE_URL=http://127.0.0.1:8000 npm --prefix apps/platform-academy run dev -- --host 127.0.0.1 &
          web_pid=$!
          trap 'kill "${api_pid}" "${web_pid}" >/dev/null 2>&1 || true' EXIT

          for _ in {1..45}; do
            if curl --connect-timeout 5 --max-time 5 -fsS http://127.0.0.1:8000/healthz >/dev/null && \
              curl --connect-timeout 5 --max-time 5 -fsS http://localhost:5174/dashboard/home >/dev/null; then
              break
            fi
            sleep 1
          done

          curl --connect-timeout 5 --max-time 30 -fsS http://127.0.0.1:8000/healthz >/dev/null
          curl --connect-timeout 5 --max-time 30 -fsS http://localhost:5174/dashboard/home >/dev/null

          smoke_status=0
          WEB_BASE=http://localhost:5174 SMOKE_ARTIFACT_DIR="${GITHUB_WORKSPACE}/smoke-artifacts" npm --prefix apps/platform-academy run smoke:routes || smoke_status=$?

          kill "${web_pid}" "${api_pid}" >/dev/null 2>&1 || true
          wait "${web_pid}" "${api_pid}" >/dev/null 2>&1 || true
          trap - EXIT

          log_status=0
          scripts/audit_api_log.sh "${api_log}" "Platform Academy browser smoke" || log_status=$?

          if [ "${smoke_status}" -ne 0 ] || [ "${log_status}" -ne 0 ]; then
            exit 1
          fi
        env:
          PYTHONPATH: apps/api
          DATABASE_URL: sqlite:///./ci-platform-browser-smoke.db
          CREATE_SCHEMA_ON_STARTUP: "true"
          AUTO_SEED: "true"
          REDIS_URL: redis://localhost:6379/0
          RATE_LIMIT_PER_MINUTE: "1000"
          OTEL_EXPORTER_OTLP_ENDPOINT: ""

      - name: Upload browser smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: platform-academy-browser-smoke
          path: smoke-artifacts
          if-no-files-found: ignore

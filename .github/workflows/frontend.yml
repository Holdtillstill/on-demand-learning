name: frontend

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - name: zhongwen
            path: apps/frontend
          - name: platform-academy
            path: apps/platform-academy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.app.path }}/package-lock.json
      - run: npm install
        working-directory: ${{ matrix.app.path }}
      - run: npm run typecheck
        working-directory: ${{ matrix.app.path }}
      - run: npm test
        working-directory: ${{ matrix.app.path }}
      - run: npm run build
        working-directory: ${{ matrix.app.path }}

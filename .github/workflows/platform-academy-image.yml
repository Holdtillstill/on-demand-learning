name: publish-platform-academy-images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - apps/platform-academy/**
      - labs/**
      - scripts/audit_api_log.sh
      - scripts/smoke_platform_academy_api.sh
      - scripts/smoke_platform_academy_labs.sh
      - scripts/smoke_platform_academy_container.sh
      - scripts/verify_api_image_migrations.sh
      - .github/workflows/platform-academy-image.yml

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AWS_REGION: us-west-2
  ECR_REPOSITORY: platform-academy

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/platform-academy/package-lock.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:api-main
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:api-${{ github.sha }}

      - name: Scan API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:api-${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Verify API image migrations
        run: API_IMAGE="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:api-${{ github.sha }}" scripts/verify_api_image_migrations.sh

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/platform-academy/Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:web-main
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:web-${{ github.sha }}

      - name: Scan web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:web-${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Install browser smoke dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: apps/platform-academy

      - name: Smoke built Platform Academy images
        run: |
          SMOKE_SKIP_BUILD=true \
          API_IMAGE="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:api-${{ github.sha }}" \
          WEB_IMAGE="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:web-${{ github.sha }}" \
          SMOKE_ARTIFACT_DIR="${GITHUB_WORKSPACE}/smoke-artifacts" \
          scripts/smoke_platform_academy_container.sh

      - name: Upload image smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: platform-academy-image-smoke
          path: smoke-artifacts
          if-no-files-found: ignore

      - name: Push images
        run: |
          docker push "${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:api-main"
          docker push "${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:api-${{ github.sha }}"
          docker push "${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:web-main"
          docker push "${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:web-${{ github.sha }}"

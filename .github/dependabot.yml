version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /apps/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      frontend-npm-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /apps/platform-academy
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      platform-academy-npm-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      api-python-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: pip
    directory: /apps/worker
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      worker-python-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      api-docker-base:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: /apps/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      frontend-docker-base:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: /apps/platform-academy
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      platform-academy-docker-base:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: /apps/worker
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      worker-docker-base:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      terraform-platform:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

[SERVICE]
    Flush        5
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*.log
    Tag               docker.*
    Parser            docker
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On

[FILTER]
    Name parser
    Match docker.*
    Key_Name log
    Parser json
    Reserve_Data On

[OUTPUT]
    Name  opensearch
    Match docker.*
    Host  opensearch
    Port  9200
    Index platform-academy-logs
    Suppress_Type_Name On
